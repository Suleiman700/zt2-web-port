<!doctype html>
<!-- Source of docs/featured.png (1280x640, the repository's social preview):
     node tools/playtest.mjs page <out-dir> with PT_SIZE=1280,640 PAGE=/docs/featured.html -->
<html><head><meta charset="utf-8"><title>Featured image</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #1d2a1a; font-family: Arial, sans-serif; }
  .shot { position: absolute; inset: 0; background: url(screenshots/zoo.png) center 40% / cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,25,10,.92) 0%, rgba(10,25,10,.75) 42%, rgba(10,25,10,0) 70%); }
  .text { position: absolute; left: 64px; top: 150px; width: 600px; color: #fff; }
  h1 { margin: 0 0 18px; font-size: 64px; line-height: 1.05; color: #ffc54e; text-shadow: 2px 3px 0 rgba(0,0,0,.6); }
  p { margin: 0 0 12px; font-size: 26px; line-height: 1.35; color: #f3f0d8; }
  .tag { display: inline-block; margin-top: 18px; padding: 8px 16px; border-radius: 6px; background: #3d6b2e; font-size: 20px; color: #fff; }
</style></head>
<body><div class="shot"></div><div class="shade"></div>
<div class="text"><h1>Zoo Tycoon 2<br>Web Port</h1>
<p>A native browser rebuild of the 2004 classic, running on the original game data. WebGL2, plain JavaScript, no emulation.</p>
<span class="tag">Unofficial fan project &middot; work in progress</span></div>
</body></html>
