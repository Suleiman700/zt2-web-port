<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZT2 Web — Asset Viewer</title>
<style>
  :root { --bg: #f4f1ea; --panel: #fffdf8; --ink: #23201b; --muted: #77705f; --line: #e2dccd; --accent: #2f7d4a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171a17; --panel: #1f231f; --ink: #ecebe4; --muted: #9a9c90; --line: #333a33; --accent: #6fc28b; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 1fr auto; height: 100dvh; }
  aside { grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 0 2px; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  #picker { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #picker label.btn { background: var(--accent); color: #fff; text-align: center; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  #picker input { display: none; }
  #picker p { margin: 0; color: var(--muted); font-size: 12px; }
  #browser { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .filters { padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
  #search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
  .filters label, #count { color: var(--muted); font-size: 12px; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { padding: 7px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #list li:hover { background: var(--bg); }
  #list li.active { background: var(--accent); color: #fff; }
  #list li.active small { color: #e6f3ea; }
  #list b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list small { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #view { width: 100%; height: 100%; display: block; touch-action: none; min-height: 0; }
  #status { padding: 8px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--panel); overflow-wrap: anywhere; }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: 45dvh 1fr auto; }
    aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
    #view { grid-row: 1; }
  }
</style>
</head>
<body>
  <aside>
    <header>
      <h1>ZT2 Web — Asset Viewer</h1>
      <p>Models &amp; textures · <a id="backLink" href="index.html">Back to sandbox</a></p>
    </header>
    <div id="picker">
      <label class="btn" for="files">Open game files (.z2f)</label>
      <input id="files" type="file" accept=".z2f" multiple>
      <p>Select <code>x300_000.z2f</code>, <code>x301_000.z2f</code> and <code>x302_000.z2f</code> from your Zoo Tycoon 2 folder. Files are read locally and never uploaded.</p>
    </div>
    <div id="browser" hidden>
      <div class="filters">
        <input id="search" type="search" placeholder="Search models (e.g. lion, elephant, fence)">
        <label><input id="hideLow" type="checkbox" checked> Hide low-detail copies</label>
        <span id="count"></span>
      </div>
      <ul id="list"></ul>
    </div>
  </aside>
  <canvas id="view"></canvas>
  <div id="status">No game files loaded.</div>
  <script type="module" src="src/viewer.js"></script>
</body>
</html>
